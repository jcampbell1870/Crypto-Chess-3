services:
  - type: web
    name: crypto-chess
    env: static
    buildCommand: ''
    staticPublishPath: .
    envVars:
      - key: REWARD_VAULT_ADDRESS
        sync: false
      - key: REWARD_AMOUNT
        sync: false
      - key: REWARD_SIGNER_PRIVATE_KEY
        sync: false
      - key: GAME_VERIFICATION_SECRET
        generateValue: true
